name: Release

# A release is cut whenever package.json's version is new on main. Bump the
# version, commit, and push to main — the workflow builds the Windows packages,
# creates the matching tag, and publishes the GitHub Release. Pushes that don't
# change the version find the release already exists and skip publishing.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

# Don't let two quick pushes race to publish the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Resolve version tag
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # .npmrc sets ignore-scripts, so no dependency's install hook runs here.
      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build Windows packages
        if: steps.check.outputs.exists == 'false'
        run: npm run dist

      - name: Generate update feed (latest.json)
        if: steps.check.outputs.exists == 'false'
        run: node scripts/make-latest.js
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}

      - name: Write SHA256SUMS.txt
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.blockmap dist/latest.yml dist/latest.json dist/SHA256SUMS.txt)
          gh release create "${{ steps.ver.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "EQAI ${{ steps.ver.outputs.tag }}" \
            --notes "${RELEASE_NOTES:-Release ${{ steps.ver.outputs.tag }}}" \
            "${files[@]}"
