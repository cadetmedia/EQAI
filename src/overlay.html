<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" />
    <title>EQAI</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="panel">
      <header id="titlebar">
        <span class="brand">
          <svg class="crest" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="12,3 18,11 12,21 6,11" fill="#67cdfa" stroke="#dff4ff" stroke-width="1"/>
            <line x1="12" y1="3" x2="12" y2="21" stroke="#dff4ff" stroke-width="0.8" opacity="0.7"/>
            <line x1="6" y1="11" x2="18" y2="11" stroke="#dff4ff" stroke-width="0.8" opacity="0.7"/>
          </svg>
          <span class="title">EQAI</span>
          <span class="version" id="version"></span>
        </span>
        <div class="controls">
          <button id="btn-clickthrough" class="icon" title="Toggle click-through (lets clicks pass to the game)">👆</button>
          <button id="btn-settings" class="icon" title="Settings">⚙</button>
          <button id="btn-clear" class="icon" title="Clear conversation">🗑</button>
        </div>
      </header>

      <main id="messages"></main>

      <div id="pending-thumb" class="hidden">
        <img id="thumb" alt="captured region" />
        <button id="thumb-remove" title="Remove capture">✕</button>
      </div>

      <footer id="composer">
        <button id="btn-capture" class="capture" title="Capture a screen region (Ctrl+Shift+A)">📷</button>
        <textarea id="input" rows="1" placeholder="Ask about a quest, drop, spawn… or capture the screen"></textarea>
        <button id="btn-send" class="send">Send</button>
      </footer>

      <div id="resize-grip" title="Drag to resize"></div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
