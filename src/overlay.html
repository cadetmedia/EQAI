<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" />
    <title>EQAI</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="panel">
      <header id="titlebar">
        <span class="brand">
          <svg class="crest" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="12,3 18,11 12,21 6,11" fill="#e8c860" stroke="#fff2c2" stroke-width="1"/>
            <line x1="12" y1="3" x2="12" y2="21" stroke="#fff2c2" stroke-width="0.8" opacity="0.7"/>
            <line x1="6" y1="11" x2="18" y2="11" stroke="#fff2c2" stroke-width="0.8" opacity="0.7"/>
          </svg>
          <span class="title">EQAI</span>
          <span class="version" id="version"></span>
        </span>
        <div class="controls">
          <button id="btn-opacity" class="icon" title="Overlay transparency">◐</button>
          <button id="btn-clickthrough" class="icon" title="Toggle click-through (lets clicks pass to the game)">👆</button>
          <button id="btn-settings" class="icon" title="Settings">⚙</button>
          <button id="btn-clear" class="icon" title="Clear conversation">🗑</button>
        </div>
      </header>

      <main id="messages"></main>

      <div id="pending-thumb" class="hidden">
        <img id="thumb" alt="captured region" />
        <button id="thumb-remove" title="Remove capture">✕</button>
      </div>

      <div id="quickbar">
        <button class="chip" data-prompt="Identify what's shown in this capture: what is it, what does it do, and is it worth keeping?">🔍 Identify this</button>
        <button class="chip" data-prompt="Based on what's shown, where am I in EverQuest Legends and how do I get here from a major hub?">📍 Where am I?</button>
        <button class="chip" data-prompt="What notable mobs or named spawns are in this zone/area, and what do they drop?">👹 What camps here?</button>
        <button class="chip" data-prompt="What is the spawn timer for the named mob shown or for this area in EverQuest Legends?">⏱ Spawn timer</button>
      </div>

      <footer id="composer">
        <button id="btn-capture" class="capture" title="Capture a screen region (Ctrl+Shift+A)">📷</button>
        <textarea id="input" rows="1" placeholder="Ask about a quest, drop, spawn… or capture the screen"></textarea>
        <button id="btn-send" class="send">Send</button>
      </footer>

      <div id="opacity-pop" class="hidden">
        <span>Transparency</span>
        <input id="opacity-range" type="range" min="15" max="100" value="92" />
      </div>

      <div id="resize-grip" title="Drag to resize"></div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
