<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" />
    <title>Select region</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; cursor: crosshair; }
      /* Frozen screenshot stretched to fill the display 1:1 with CSS pixels. */
      #bg { position: fixed; inset: 0; width: 100%; height: 100%; -webkit-user-drag: none; }
      #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); }
      #sel {
        position: fixed;
        border: 2px solid #6aa8ff;
        background: rgba(106, 168, 255, 0.12);
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
        display: none;
      }
      #hint {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; color: #fff;
        background: rgba(18, 20, 28, 0.85); padding: 8px 14px; border-radius: 8px;
        border: 1px solid rgba(120, 170, 255, 0.4); pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img id="bg" alt="" />
    <div id="dim"></div>
    <div id="sel"></div>
    <div id="hint">Drag to select a region · Esc to cancel</div>
    <script src="selector.js"></script>
  </body>
</html>
